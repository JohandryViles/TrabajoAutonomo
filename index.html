<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-card">
        <div class="card-header">
            <h1 class="card-title">Iniciar Sesión</h1>
            <p class="card-description">Ingresa tus credenciales para acceder a tu cuenta</p>
        </div>

        <div class="card-content">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 001 2z"/>
                        </svg>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="tu@ejemplo.com" 
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input with-toggle" 
                            placeholder="••••••••" 
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <svg id="eyeOff" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                            <svg id="eye" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span id="btnText">Iniciar Sesión</span>
                </button>
            </form>

            <div class="separator-container">
                <div class="separator-line"></div>
                <span class="separator-text">o</span>
            </div>

            <button type="button" class="btn btn-outline" id="googleBtn">
                <svg class="microsoft-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <rect x="3" y="3" width="8" height="8" fill="#F25022" />
                    <rect x="13" y="3" width="8" height="8" fill="#7FBA00" />
                    <rect x="3" y="13" width="8" height="8" fill="#00A4EF" />
                    <rect x="13" y="13" width="8" height="8" fill="#FFB900" />
                </svg>
                Continuar con Microsoft
            </button>
        </div>

        <div class="card-footer">
            <button type="button" class="link-button" id="forgotPasswordBtn">
                ¿Olvidaste tu contraseña?
            </button>
            <div class="signup-text">
                ¿No tienes cuenta? 
                <a href="#" class="signup-link" id="signupLink">Crear cuenta</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
