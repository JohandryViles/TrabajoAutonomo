<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control de Asistencia - ULEAM</title>
    <link rel="stylesheet" href="appuser.css">
</head>
<body>
    <!-- Toast Container -->
    <div id="toast-container"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <button id="menu-toggle" class="menu-toggle">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div>
                        <h1>Sistema de Control de Asistencia</h1>
                        <p class="subtitle">Universidad Laica Eloy Alfaro de Manabí</p>
                    </div>
                </div>
                
                <div class="header-right">
                    <div class="role-selector">
                        <span>Rol:</span>
                        <select id="role-select" class="select-role">
                            <option value="docente">Docente</option>
                            <option value="administrador">Administrador</option>
                        </select>
                    </div>
                    
                    <div class="user-info">
                        <div class="avatar">JV</div>
                        <div class="user-details">
                            <p>Ing. Johandry Viles</p>
                            <p class="email">e1315641827@live.uleam.edu.ec</p>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="main-layout">
            <!-- Sidebar -->
            <aside id="sidebar" class="sidebar">
                <!-- User Info en Sidebar -->
                <div class="sidebar-header">
                    <div class="sidebar-user">
                        <div class="avatar small">JM</div>
                        <div class="sidebar-user-details">
                            <p>Ing. Johandry Viles</p>
                            <p class="email-small">e1315641827@live.uleam.edu.ec</p>
                        </div>
                    </div>
                    <div id="role-badge" class="badge badge-secondary">Modo Docente</div>
                    <button id="back" class="btn-back">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5"/>
                            <polyline points="12 19 5 12 12 5"/>
                        </svg>
                        Regresar
                    </button>
            
                    <button id="logout" class="btn-logout">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Cerrar Sesión
                    </button>
                </div>
                
                <!-- Menu de Navegacion-->
                <nav class="nav-menu">
                    <button class="nav-item active" data-view="profile">
                        <svg class="icon-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <div class="nav-content">
                            <p class="nav-label">Mi Perfil</p>
                            <p class="nav-description">Información personal y asistencia</p>
                        </div>
                    </button>
                    
                    <button class="nav-item hidden" data-view="reports">
                        <svg class="icon-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="20" x2="12" y2="10"></line>
                            <line x1="18" y1="20" x2="18" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="16"></line>
                        </svg>
                        <div class="nav-content">
                            <p class="nav-label">Reportes y Estadísticas</p>
                            <p class="nav-description">Análisis y reportes generales</p>
                        </div>
                    </button>
                    
                    <button class="nav-item hidden" data-view="admin">
                        <svg class="icon-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M12 1v3m0 16v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3m16 0h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" />
                        </svg>
                        <div class="nav-content">
                            <p class="nav-label">Administración</p>
                            <p class="nav-description">Gestión del sistema</p>
                        </div>
                    </button>
                </nav>
            </aside>

            <!-- Overlay -->
            <div id="overlay" class="overlay"></div>

            <!-- Main Content -->
            <main class="main-content">
                <div class="content-wrapper">
                    <!-- Profile View -->
                    <div id="profile-view" class="view-container active"></div>
                    
                    <!-- Reports View -->
                    <div id="reports-view" class="view-container"></div>
                    
                    <!-- Admin View -->
                    <div id="admin-view" class="view-container"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
